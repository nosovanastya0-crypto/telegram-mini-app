<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="theme-color" content="#0c0b10">
<title>Норма — дневник питания</title><script async src="https://telegram.org/js/telegram-web-app.js" id="tg"></script>
<style>
:root{color-scheme:dark;--bg:#0c0b10;--panel:#17151f;--edge:#ffffff20;--muted:#bab4c9;--pearl:linear-gradient(112deg,#ffc0e5,#c5a8ff 49%,#9edcff);font:16px/1.4 system-ui,sans-serif;color:#fcf8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#21152b,transparent 420px),var(--bg)}button,input,select{font:inherit}button{cursor:pointer;color:inherit;border:1px solid var(--edge);background:#211d2b;border-radius:15px;min-height:44px;padding:9px 13px}button:active{transform:scale(.98)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #bde5ff;outline-offset:3px}button:disabled{opacity:.4;cursor:default}main{max-width:480px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 17px calc(106px + env(safe-area-inset-bottom))}header,.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:800;letter-spacing:-.06em;font-size:24px}.mark{display:inline-block;width:16px;height:16px;background:var(--pearl);border-radius:50%;margin-right:8px;box-shadow:0 0 15px #d597ef80}.dim,small{color:var(--muted)}small{font-size:12px}h1,h2,p{margin:0}h1{font-size:29px;letter-spacing:-.055em}h2{font-size:19px;letter-spacing:-.035em}.title{margin:19px 0 13px}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:13px 0 15px}.week button{padding:5px 0;border-radius:22px;background:transparent;font-size:14px}.week small{display:block}.week .on{background:var(--pearl);color:#1a1123}.week .on small{color:#302341}
.card{border:1px solid var(--edge);background:var(--panel);border-radius:25px;padding:16px;margin-bottom:12px;overflow:hidden}.energy{background:radial-gradient(ellipse at 95% 5%,#68457175,transparent 65%),radial-gradient(ellipse at 8% 100%,#3e4774aa,transparent 60%),#191524}.energy-top{min-height:111px}.big{font-size:44px;font-weight:750;letter-spacing:-.075em;line-height:1.04;font-variant-numeric:tabular-nums}.ring{width:103px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#ffc2e8,#bea5ff calc(var(--fill)*.55),#a3dcff var(--fill),#ffffff20 var(--fill));flex:none;box-shadow:0 0 22px #bf90ff40}.ring span{width:83%;height:83%;display:grid;place-items:center;border-radius:50%;background:#251c32;font-size:21px;font-weight:700}.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-top:15px;padding-top:12px;border-top:1px solid var(--edge)}.track{height:5px;border-radius:10px;background:#ffffff25;overflow:hidden;margin:7px 0}.track i{display:block;height:100%;background:var(--bar,var(--pearl));border-radius:inherit}
.section{margin:17px 0 9px}.primary{background:var(--pearl);color:#21142b;border-color:transparent;font-weight:750}.wide{width:100%}.methods{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:9px 0 13px}.method{position:relative;text-align:left;overflow:hidden;min-height:100px;padding:12px;background:radial-gradient(ellipse at 92% 10%,#ac548b,transparent 72%),#342039}.method:nth-child(2){background:radial-gradient(ellipse at 92% 10%,#597bb7,transparent 72%),#2d2549}.method strong,.method small{position:relative;display:block}.method small{color:#eee4ff}.method b{display:grid;place-items:center;width:32px;height:32px;border-radius:11px;background:#ffffff21;margin-bottom:5px;font-size:18px}.water{background:radial-gradient(ellipse at 100% 0,#344879,transparent 70%),#171c32}.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.quick button{flex:1;white-space:nowrap;font-size:13px}.meal{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:9px;width:100%;text-align:left;margin-top:7px}.food-icon{width:35px;height:35px;object-fit:cover;border-radius:10px;background:#ffffff14;display:grid;place-items:center}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);padding:8px 17px calc(9px + env(safe-area-inset-bottom));background:#0c0b10ee;z-index:2}.nav-inner{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;background:#1c1825;border:1px solid var(--edge);padding:4px;border-radius:24px}.nav button{border:0;background:none;padding:4px 1px;font-size:11px;border-radius:19px}.nav b{display:block;font-size:19px;line-height:1.15}.nav .on{background:#d6baf8;color:#20142b}.nav .add:not(.on){color:#f4c6f3}.notice{margin:8px 0;color:#e4c4eb;font-size:13px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fields label{min-width:0}label{display:block;color:var(--muted);font-size:13px;margin:9px 0}input,select{display:block;width:100%;min-width:0;background:#100e17;border:1px solid var(--edge);color:#fff;border-radius:12px;padding:10px;margin-top:4px;min-height:44px}input[type=file]{font-size:13px}.preview{width:100%;max-height:180px;object-fit:contain;border-radius:12px;margin:8px 0}.danger{color:#ffb7cd}.status{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:90%;width:max-content;background:#ead6ff;color:#21142b;border-radius:20px;padding:9px 16px;z-index:4;font-size:13px}.status:empty{display:none}.inline{display:flex;align-items:end;gap:8px}.inline label{flex:1}.inline button{margin-bottom:9px}.compact{padding:5px 10px;font-size:13px}

:root{--pearl:linear-gradient(112deg,#ff9ad6 0%,#e4a2ff 35%,#ac9eff 64%,#80e8ff 100%);--edge:#e5c7ff30}
body{background:radial-gradient(ellipse 340px 280px at 52% -70px,#63338c80,transparent),#0c0b10}
.energy{background:radial-gradient(ellipse at 100% 2%,#d34cba 0%,#823888 24%,transparent 58%),radial-gradient(ellipse at 6% 110%,#5667eb 0%,#423d96 28%,transparent 63%),#21162f;box-shadow:inset 0 1px 0 #ffd4ff42,0 10px 28px #562b7c38}
.energy small,.water small{color:#f4eaff}
.ring{box-shadow:0 0 24px #e59cff76,inset 0 0 10px #ffffff40}
.primary{box-shadow:inset 0 1px 0 #fff8,0 5px 18px #d579fd48}
.method{border-radius:20px;background:radial-gradient(ellipse at 100% 0%,#ff9acc,#c44299 28%,transparent 69%),linear-gradient(145deg,#4f1e57,#31162d 65%,#8d2d6b);box-shadow:inset 0 1px 0 #ffd2ef40}
.method:nth-child(2){background:radial-gradient(ellipse at 105% 0%,#a2e9ff,#597bed 29%,transparent 71%),linear-gradient(145deg,#38285f,#261a48 64%,#5148ab);box-shadow:inset 0 1px 0 #d4ecff50}


.water{background:radial-gradient(ellipse at 100% 0%,#237aa3,#234d88 33%,transparent 70%),radial-gradient(ellipse at 0% 100%,#493c93,transparent 62%),#16243d;box-shadow:inset 0 1px 0 #b6f6ff40}
.water .quick button{background:linear-gradient(130deg,#254267,#3a3367);border-color:#9be5ff43}
.water-title{display:flex;align-items:center;gap:8px}
.drop{display:inline-block;width:20px;height:20px;vertical-align:middle;background:linear-gradient(145deg,#ddffff,#82e7ff 40%,#728dff);clip-path:path('M10 0C8 4 2 9 2 12.5a8 7.5 0 0 0 16 0C18 9 12 4 10 0Z')}
.nav b .drop{width:20px;height:20px}.nav .on .drop{background:#30234d}
.meal{background:linear-gradient(108deg,#28213a,#201b2d 56%,#262444)}

:root{--bg:#090f1b;--edge:#dce5ff32}
body{background:radial-gradient(ellipse 460px 280px at 50% -90px,#24365c,transparent),var(--bg)}
.nav{background:#090f1bee}.nav-inner{background:#151d30}
.dashboard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.dash-stack{display:flex;flex-direction:column;gap:9px;min-width:0}
.dashboard .card{margin:0;padding:13px;border-radius:29px}
.dashboard .water{min-height:185px;background:radial-gradient(ellipse at 12% 104%,#168994,transparent 75%),linear-gradient(155deg,#203e81,#13345b 65%,#186b76);box-shadow:inset 0 0 18px #62e8ff72;border-color:#69ddf06b}
.dashboard .water .row{align-items:flex-start;flex-direction:column;gap:1px}
.dashboard .water .quick{gap:4px}.dashboard .water .quick button{min-height:44px;padding:3px;font-size:11px;background:#0e284d9c}
.dashboard .energy{flex:1;background:radial-gradient(ellipse at 80% 0%,#c93da4,transparent 63%),radial-gradient(ellipse at 8% 100%,#a63681,transparent 67%),linear-gradient(150deg,#792965,#48244e);box-shadow:inset 0 0 20px #ff9deaa0;border-color:#f999d77d}
.dashboard .energy-top{flex-direction:column;align-items:flex-start;min-height:0}
.dashboard .big{font-weight:500;font-size:clamp(30px,9vw,45px);line-height:1.1}
.dashboard .ring{width:68px;align-self:center;margin-top:3px}.dashboard .ring span{background:#642756;font-size:15px}
.dashboard .macros{grid-template-columns:1fr;gap:3px;margin-top:9px;padding-top:7px}.dashboard .macros>div{display:grid;grid-template-columns:1fr auto;gap:0 6px}.dashboard .macros .track{grid-row:2;grid-column:1/-1;margin:3px 0}
.dash-actions{background:radial-gradient(ellipse at 75% 0%,#548d72,transparent 70%),linear-gradient(155deg,#1a4037,#102523 72%,#205f49);box-shadow:inset 0 0 19px #75e9ac70;border-color:#75e9ac68}
.dashboard .methods{grid-template-columns:1fr;gap:6px;margin:8px 0}.dashboard .method{min-height:64px;padding:7px 8px;border-radius:14px}.dashboard .method b{display:none}
.dashboard .primary{font-size:13px;padding:7px;line-height:1.15}
.dash-diary{flex:1;background:radial-gradient(ellipse at 0 0,#885b50,transparent 70%),radial-gradient(ellipse at 15% 100%,#285d9f,transparent 75%),#254457;box-shadow:inset 0 0 18px #a5e2ed69;border-color:#ace3f05c}.dash-diary .compact{margin-top:12px;background:#14273d9c}
</style></head><body><main id="app"></main><nav class="nav" aria-label="Разделы"><div class="nav-inner" id="nav"></div></nav><div class="status" id="status" role="status"></div>
<script>
'use strict';
const fallback=[{"id":"oats","name":"Овсянка с бананом","grams":250,"kcal":340,"p":11,"f":10,"c":52,"icon":"🥣","meal":"Завтрак","time":"08:45","alias":"овсянка,каша,овсяная"},{"id":"chicken","name":"Курица с рисом и овощами","grams":320,"kcal":495,"p":36,"f":15,"c":54,"icon":"🍚","meal":"Обед","time":"13:10","alias":"курица,рис,куриная"},{"id":"yogurt","name":"Греческий йогурт с ягодами","grams":180,"kcal":145,"p":15,"f":4,"c":12,"icon":"🫐","meal":"Перекус","time":"16:20","alias":"йогурт,ягоды"},{"id":"salmon","name":"Лосось с запечённым картофелем","grams":290,"kcal":448,"p":30,"f":20,"c":37,"icon":"🍽️","meal":"Ужин","time":"19:00","alias":"лосось,картофель,рыба"}];
const goals={kcal:1900,p:110,f:65,c:220,water:2000};
const app=document.querySelector('#app'), nav=document.querySelector('#nav'), status=document.querySelector('#status');
const key='norma-mini-app-v1';
let state={days:{}}, examples=fallback, sourceNotice='', storageNotice='', page='home', draft=null, timer;
try{const saved=JSON.parse(localStorage.getItem(key));if(saved?.days)state=saved}catch{storageNotice='Локальное хранилище недоступно или повреждено.'}
const dateKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const today=dateKey(new Date()); let day=today;
const toDate=k=>new Date(k+'T12:00:00');
const shift=(k,delta)=>{const d=toDate(k);d.setDate(d.getDate()+delta);return dateKey(d)};
// Demo meals carried an alias from the catalog. User-saved meals never did.
let removedDemoMeals = false;
for (const dayLog of Object.values(state.days)) {
  if (!Array.isArray(dayLog?.meals)) continue;
  const realMeals = dayLog.meals.filter(meal => !fallback.some(example =>
    ['alias', 'name', 'grams', 'kcal', 'p', 'f', 'c', 'time'].every(field => meal?.[field] === example[field])
  ));
  if (realMeals.length !== dayLog.meals.length) {
    dayLog.meals = realMeals;
    removedDemoMeals = true;
  }
}
if (removedDemoMeals) save();
const current=()=>state.days[day]??{meals:[],water:[]};
const update=()=>state.days[day]??=current();
const num=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}).format(n);
const fmt=(k,opts)=>toDate(k).toLocaleDateString('ru-RU',opts);
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()??Date.now()+'-'+Math.random().toString(36).slice(2);
const pct=(n,max)=>Math.min(100,Math.round(n/max*100));
const time=()=>new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
function telegram(){try{const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();tg?.setHeaderColor?.('#0c0b10')}catch{}}
document.querySelector('#tg').addEventListener('load',telegram);
telegram();
function say(message){clearTimeout(timer);status.textContent=message;timer=setTimeout(()=>status.textContent='',2800)}
function save(){try{localStorage.setItem(key,JSON.stringify(state));storageNotice=''}catch{storageNotice='Изменения видны до закрытия страницы. Сохранить их в браузере не удалось.'}}
function valid(items){return Array.isArray(items)&&items.length>=3&&items.every(x=>x&&['id','name','alias','icon','meal','time'].every(k=>typeof x[k]==='string')&&['grams','kcal','p','f','c'].every(k=>Number.isFinite(x[k])&&x[k]>=0)&&x.grams>0)}
const button=(act,label,cls='')=>'<button type="button" data-act="'+act+'" class="'+cls+'">'+label+'</button>';
const track=(n,max,color)=>'<div class="track" aria-hidden="true"><i style="width:'+pct(n,max)+'%;--bar:'+color+'"></i></div>';
const heading=title=>'<div class="title row"><h1>'+title+'</h1></div>';
function calendar(){return '<div class="week" role="group" aria-label="Выбор дня">'+Array.from({length:7},(_,i)=>{const k=shift(day,i-3);return '<button type="button" data-day="'+k+'" aria-label="'+fmt(k,{day:'numeric',month:'long'})+'" aria-pressed="'+(k===day)+'" class="'+(k===day?'on':'')+'"><small>'+fmt(k,{weekday:'short'})+'</small>'+toDate(k).getDate()+'</button>'}).join('')+'</div>'}
function meals(items){return items.length?items.map(m=>'<button class="meal" type="button" data-meal="'+escape(m.id)+'">'+(m.photo&&/^data:image\/jpeg;base64,/.test(m.photo)?'<img class="food-icon" alt="" src="'+escape(m.photo)+'">':'<span class="food-icon" aria-hidden="true">'+escape(m.icon||'🍽️')+'</span>')+'<span><strong>'+escape(m.name)+'</strong><br><small>'+escape(m.meal)+' · '+escape(m.time)+' · '+num(m.grams)+' г</small></span><small>'+num(m.kcal)+' ккал</small></button>').join(''):'<p class="dim">За этот день пока нет записей.</p>'}
function methods(){return '<div class="methods">'+button('photo','<b aria-hidden="true">◎</b><strong>По фото</strong><small>Демо по снимку</small>','method')+button('text','<b aria-hidden="true">≡</b><strong>Текстом</strong><small>Блюдо и порция</small>','method')+'</div>'}
function waterCard(water){return '<section class="card water"><div class="row"><h2 class="water-title"><i class="drop" aria-hidden="true"></i>Вода</h2><small>Цель '+num(goals.water)+' мл</small></div><strong style="font-size:27px">'+num(water)+' <small>мл</small></strong>'+track(water,goals.water,'#a4d9ff')+'<div class="quick">'+[150,250,500].map(x=>button('water-'+x,'+'+x+' мл')).join('')+'</div></section>'}
const activityFactors={low:1.2,normal:1.55,high:1.725};
function dailyCalories(p){
  return Math.round((10*p.weight+6.25*p.height-5*p.age+(p.sex==='male'?5:-161))*activityFactors[p.activity]);
}
function profile(){
  const p=state.profile??{};
  const field=(key,label,min,max,step)=>'<label>'+label+'<input name="'+key+'" type="number" required min="'+min+'" max="'+max+'" step="'+step+'" value="'+escape(p[key])+'"></label>';
  const options=(pairs,value)=>pairs.map(([key,label])=>'<option value="'+key+'" '+(key===value?'selected':'')+'>'+label+'</option>').join('');
  return heading('Профиль')+'<section class="card energy"><small>Поддержание веса</small><div class="big">'+(state.profile?num(dailyCalories(p)):'—')+'</div><small>ккал в день</small></section><section class="card"><form id="profileForm"><div class="fields">'+field('height','Рост, см',100,250,1)+field('weight','Вес, кг',30,350,0.1)+field('age','Возраст, лет',18,120,1)+'<label>Пол<select name="sex" required>'+options([['','Выбрать'],['female','Женский'],['male','Мужской']],p.sex)+'</select></label></div><label>Активность<select name="activity" required>'+options([['','Выбрать'],['low','Низкая · мало движения'],['normal','Нормальная · регулярное движение'],['high','Высокая · интенсивная нагрузка']],p.activity)+'</select></label><button class="primary wide">Рассчитать и сохранить</button></form><p class="notice">Оценка по формуле Миффлина — Сан Жеора с коэффициентом активности. Цель появится на главной.</p></section>';
}
function home(){const calorieGoal=state.profile?dailyCalories(state.profile):goals.kcal;const d=current();const t={kcal:0,p:0,f:0,c:0};for(const m of d.meals)for(const k of Object.keys(t))t[k]+=m[k];const diff=calorieGoal-t.kcal;
return '<div class="title row"><h1>Мой рацион</h1><small>'+fmt(day,{day:'numeric',month:'long'})+'</small></div>'+calendar()+'<div class="dashboard"><div class="dash-stack">'+'<section class="card energy"><div class="row energy-top"><div><small>Съедено за день</small><div class="big">'+num(t.kcal)+'</div><small>из '+num(calorieGoal)+' ккал</small><div style="margin-top:5px;font-size:13px">'+(diff>=0?'Осталось ':'Сверх цели ')+num(Math.abs(diff))+' ккал</div></div><div class="ring" style="--fill:'+pct(t.kcal,calorieGoal)+'%"><span>'+Math.round(t.kcal/calorieGoal*100)+'%</span></div></div><div class="macros">'+[['p','Белки','#ffacd8'],['f','Жиры','#cab0ff'],['c','Углеводы','#a5dcff']].map(([k,l,c])=>'<div><small>'+l+'</small>'+track(t[k],goals[k],c)+'<small><strong style="color:white">'+num(t[k])+'</strong> / '+goals[k]+' г</small></div>').join('')+'</div></section>'+waterCard(d.water.reduce((s,w)=>s+w.ml,0))+'</div><div class="dash-stack"><section class="card dash-actions"><h2>Добавить еду</h2>'+methods()+button('choose','＋ Добавить приём пищи','primary wide')+'</section><section class="card dash-diary"><h2>Дневник</h2><div class="big">'+num(d.meals.length)+'</div><small>Записей за день</small>'+button('diary','Все записи →','wide compact')+'</section></div></div>'}
function waterPage(){const list=current().water;return heading('Вода')+calendar()+waterCard(list.reduce((s,w)=>s+w.ml,0))+'<section class="card"><form id="waterForm" class="inline"><label>Свой объём, мл<input name="ml" type="number" min="1" max="5000" required placeholder="300"></label><button class="primary">Добавить</button></form><h2>История</h2>'+(list.length?list.slice().reverse().map(w=>'<div class="row section"><span>'+num(w.ml)+' мл · '+escape(w.time)+'</span><button type="button" class="compact danger" data-water-id="'+escape(w.id)+'" aria-label="Удалить '+w.ml+' мл">Удалить</button></div>').join(''):'<p class="dim">Вода ещё не записана.</p>')+'</section>'}
function entry(){const m=draft;const edit=page==='edit';return heading(edit?'Редактировать':page==='photo'?'Добавить по фото':'Добавить текстом')+button(edit?'diary':'choose','← Назад','compact')+'<div style="height:10px"></div>'+(!edit&&page==='photo'?'<section class="card"><h2>Фото блюда</h2><p class="notice">Демо-анализ подставляет пример из каталога. Содержимое фото не распознаётся.</p><label>Снимок блюда<input id="photo" type="file" accept="image/*"></label>'+(m.photo?'<img class="preview" alt="Выбранное фото блюда" src="'+escape(m.photo)+'">':'')+'<label>Демонстрационный пример<select id="sample">'+examples.map(x=>'<option value="'+escape(x.id)+'" '+(x.id===m.sample?'selected':'')+'>'+escape(x.name)+'</option>').join('')+'</select></label>'+button('demo','Подставить пример','wide')+'</section>':'')+(!edit&&page==='text'?'<section class="card"><form id="lookup"><label>Опишите блюдо и порцию<input name="query" value="'+escape(m.query)+'" placeholder="Например, овсянка 200 г" required maxlength="160"></label><button class="wide">Найти в каталоге</button></form><p class="notice">Поиск по демо-каталогу. Для другого блюда введите значения вручную.</p>'+(m.hint?'<p role="status" class="notice">'+escape(m.hint)+'</p>':'')+'</section>':'')+'<section class="card"><h2>Блюдо и КБЖУ</h2><form id="mealForm"><label>Название<input name="name" required maxlength="120" value="'+escape(m.name)+'"></label><div class="fields"><label>Приём пищи<select name="meal">'+['Завтрак','Обед','Ужин','Перекус'].map(x=>'<option '+(x===m.meal?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label>Время<input name="time" type="time" required value="'+escape(m.time)+'"></label>'+[['grams','Порция, г',1,5000],['kcal','Калории, ккал',0,10000],['p','Белки, г',0,1000],['f','Жиры, г',0,1000],['c','Углеводы, г',0,1000]].map(([k,l,min,max])=>'<label>'+l+'<input type="number" name="'+k+'" required min="'+min+'" max="'+max+'" step="0.1" value="'+escape(m[k])+'"></label>').join('')+'</div><small>Значения указаны на всю порцию.</small><div style="height:10px"></div><button class="primary wide">Сохранить в дневник</button></form>'+(edit?'<div style="height:8px"></div>'+button('delete','Удалить запись','wide danger'):'')+'</section>'}
function render(){const d=current();const todayBtn=day!==today?button('today','Сегодня','compact'):'<small>Сегодня</small>';app.innerHTML='<header><div class="brand"><i class="mark"></i>норма</div>'+todayBtn+'</header>'+({home,profile,water:waterPage,diary:()=>heading('Дневник питания')+calendar()+button('choose','＋ Добавить приём пищи','primary wide')+'<div style="height:10px"></div>'+meals(d.meals.slice().sort((a,b)=>b.time.localeCompare(a.time))),choose:()=>heading('Добавить приём пищи')+'<p class="dim">'+fmt(day,{day:'numeric',month:'long'})+'</p>'+methods(),photo:entry,text:entry,edit:entry}[page]())+(storageNotice?'<p role="status" class="notice">'+escape(storageNotice)+'</p>':'')+(sourceNotice?'<p class="notice">'+escape(sourceNotice)+'</p>':'');nav.innerHTML=[['home','⌂','Главная'],['diary','▤','Дневник'],['choose','＋','Добавить'],['water','<i class="drop"></i>','Вода'],['profile','♙','Профиль']].map(([k,icon,label])=>'<button type="button" data-act="'+k+'" class="'+(k===page?'on':'')+(k==='choose'?' add':'')+'" '+(k===page?'aria-current="page"':'')+'><b aria-hidden="true">'+icon+'</b>'+label+'</button>').join('')}
function go(next){page=next;render();window.scrollTo(0,0)}
function addWater(ml){if(!Number.isInteger(ml)||ml<1||ml>5000)return;update().water.push({id:uid(),ml,time:time()});save();render();say('Добавлено '+ml+' мл')}
function applyExample(item,grams){const fields={name:item.name,icon:item.icon,grams};for(const k of ['kcal','p','f','c'])fields[k]=Math.round(item[k]*grams/item.grams*10)/10;Object.assign(draft,fields)}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;
if(b.dataset.day){day=b.dataset.day;render();return}
if(b.dataset.meal){draft={...current().meals.find(m=>m.id===b.dataset.meal)};go('edit');return}
if(b.dataset.waterId){update().water=current().water.filter(w=>w.id!==b.dataset.waterId);save();render();say('Запись о воде удалена');return}
const act=b.dataset.act;if(!act)return;
if(act.startsWith('water-')){addWater(Number(act.slice(6)));return}
if(act==='today'){day=today;go(['photo','text','edit'].includes(page)?'home':page);return}
if(act==='photo'||act==='text'){draft={time:time(),meal:'Перекус',sample:examples[0].id};go(act);return}
if(act==='demo'){if(!draft.photo){say('Сначала выберите фото');return}const item=examples.find(x=>x.id===draft.sample)??examples[0];applyExample(item,item.grams);render();say('Подставлен демонстрационный пример');return}
if(act==='delete'){if(!confirm('Удалить этот приём пищи?'))return;update().meals=current().meals.filter(m=>m.id!==draft.id);save();go('diary');say('Приём пищи удалён');return}
go(act)});
document.addEventListener('input',event=>{const el=event.target;if(el.form?.id==='mealForm'&&el.name)draft[el.name]=el.value;if(el.form?.id==='lookup')draft.query=el.value;if(el.id==='sample')draft.sample=el.value});
document.addEventListener('submit',event=>{event.preventDefault();const f=new FormData(event.target);
if(event.target.id==='profileForm'){
  const p={height:Number(f.get('height')),weight:Number(f.get('weight')),age:Number(f.get('age')),sex:f.get('sex'),activity:f.get('activity')};
  if(!Number.isFinite(dailyCalories(p))||dailyCalories(p)<=0){say('Проверьте данные профиля');return}
  state.profile=p;save();render();say('Дневная цель обновлена');return;
}
if(event.target.id==='waterForm'){addWater(Number(f.get('ml')));return}
if(event.target.id==='lookup'){const query=String(f.get('query')).trim().toLowerCase();draft.query=f.get('query');const item=examples.find(x=>x.alias.toLowerCase().split(',').some(word=>query.includes(word.trim())));const match=query.match(/(\d+(?:[.,]\d+)?)\s*(?:грамм[а-я]*|г|g)(?=\s|$|[.,;])/i);const grams=match?Number(match[1].replace(',','.')):item?.grams;if(item&&grams>=1&&grams<=5000){applyExample(item,grams);draft.hint='Найден пример из каталога. Проверьте состав и порцию.'}else{if(!draft.name)draft.name=String(f.get('query')).trim().slice(0,120);draft.hint=item?'Укажите порцию от 1 до 5 000 г.':'Пример не найден. Заполните КБЖУ вручную.'}render();return}
if(event.target.id==='mealForm'){const name=String(f.get('name')).trim();if(!name){say('Введите название блюда');return}const m={id:draft.id??uid(),name,meal:f.get('meal'),time:f.get('time'),icon:draft.icon??'🍽️',photo:draft.photo??''};for(const k of ['grams','kcal','p','f','c'])m[k]=Number(f.get(k));const list=update().meals;const index=list.findIndex(x=>x.id===m.id);if(index<0)list.push(m);else list[index]=m;save();go('diary');say('Приём пищи сохранён')}});
let photoRequest=0;
document.addEventListener('change',async event=>{if(event.target.id!=='photo')return;const file=event.target.files[0];if(!file)return;const target=draft,request=++photoRequest;try{const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const ratio=Math.min(1,480/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*ratio));canvas.height=Math.max(1,Math.round(img.height*ratio));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);if(draft!==target||page!=='photo'||request!==photoRequest)return;target.photo=canvas.toDataURL('image/jpeg',.7);render()}finally{URL.revokeObjectURL(url)}}catch{if(draft===target&&page==='photo'&&request===photoRequest)say('Фото не открылось. Выберите JPG, PNG или WebP.')}});
app.innerHTML='<p class="dim">Загружаем дневник…</p>';
const controller=new AbortController(), timeout=setTimeout(()=>controller.abort(),2200);
fetch('data.json?v='+Date.now(),{cache:'no-store',signal:controller.signal}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{if(!valid(data))throw Error('format');examples=data}).catch(()=>{sourceNotice='Используется встроенный демо-каталог.'}).finally(()=>{clearTimeout(timeout);render()});
</script></body></html>
